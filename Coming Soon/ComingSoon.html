<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon | Double OO</title>
  <link rel="stylesheet" href="coming-soon.css" />
</head>

<body>
  <main class="coming-soon-page">
    <div class="noise"></div>
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>

    <nav class="coming-nav">
      <img src="../assets/BlackLogo.png" alt="Double OO Logo" />
      <a href="../index.html">Back to Home</a>
    </nav>

    <section class="coming-content">
      <p class="eyebrow">Double OO</p>

      <h1>Something Premium is Coming.</h1>

      <p class="coming-text">
        We are crafting a refined digital experience designed to help businesses
        launch faster, look sharper, and grow with confidence.
      </p>

      <div class="coming-actions">
        <a href="index.html#contact" class="btn btn-primary">Contact Double OO</a>
        <a href="DIY.html" class="btn btn-secondary">Explore Build Your Website</a>
      </div>

      <div class="countdown" id="countdown">
        <div><span id="days">00</span><small>Days</small></div>
        <div><span id="hours">00</span><small>Hours</small></div>
        <div><span id="minutes">00</span><small>Minutes</small></div>
        <div><span id="seconds">00</span><small>Seconds</small></div>
      </div>
    </section>
  </main>

  <script src="coming-soon.js"></script>

</html>
